# Logging settings for slf4j-simple (all output goes to the console).
# Levels, most to least verbose: trace, debug, info, warn, error.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
# The connection pool is chatty at info level.
org.slf4j.simpleLogger.log.com.zaxxer.hikari=warn
# Security events (logins, lockouts, sign-ups) are logged under the "security" logger by
# SecurityLog.java. Keep this at info or they won't appear.
org.slf4j.simpleLogger.log.security=info
