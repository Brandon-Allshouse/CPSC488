# Runs the whole app (database, backend, frontend) with one command, from the repo root:
#
#   docker compose up --build
#
# See the README for first-time setup.

name: brainfeed

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: brainfeed
      POSTGRES_USER: ${DB_USER:-brainfeed}
      # No default on purpose. Postgres only reads this when the database is first created, so
      # after changing DB_PASSWORD, run `docker compose down -v` (deletes local data).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env - copy .env.example to .env}
      # Use SCRAM-SHA-256 for database logins instead of the older md5 method.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      # 127.0.0.1 only, so the database can't be reached from the network. Database tools like
      # IntelliJ's can still connect from this machine.
      - "127.0.0.1:5432:5432"
    volumes:
      # Kept across `docker compose down`; `down -v` erases it. Postgres 18+ stores its files in a
      # per-version subfolder, so the parent folder is mounted. When moving to a new Postgres major
      # version, rename this volume, since the new version can't read the old files.
      - brainfeed-pgdata:/var/lib/postgresql
    healthcheck:
      # Lets the backend wait until Postgres is actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d brainfeed"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - data

  backend:
    build: ./backend
    # All settings and secrets come from .env (see .env.example)...
    env_file: .env
    environment:
      # ...except the database address: inside Docker, the database is reached by its service
      # name "db", not "localhost".
      DB_URL: jdbc:postgresql://db:5432/brainfeed
      # Browsers reach the backend through the Vite dev server in the "frontend" container, so it's
      # the one proxy whose X-Forwarded-For header is believed (see ClientIp.java).
      TRUSTED_PROXIES: frontend
      # The LLM that writes video summaries and quizzes (the ollama service below).
      OLLAMA_URL: http://ollama:11434
      # Same default as ollama-pull below, so the backend asks for the model that was downloaded.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Only needed to call the API directly (e.g. curl); the frontend reaches it inside Docker.
      - "127.0.0.1:7070:7070"
    # The only service on more than one network, so every request to the database or the LLM has
    # to go through it.
    networks:
      - data
      - web
      - llm

  # Runs a free, open LLM on this laptop for video summaries and quizzes, so it costs nothing and
  # no API key is needed. It uses the CPU, so loading the model takes ~10 seconds; the backend
  # loads it when it starts and when someone opens the feed, so people rarely wait for that.
  # Ollama has no login, so it gets no port: only the backend can reach it.
  ollama:
    image: ollama/ollama:0.40.11
    environment:
      # Keep the model in memory for 30 minutes after the last summary, then free the RAM. The
      # backend also sends this with every request (OllamaClient.KEEP_ALIVE); this is the fallback.
      OLLAMA_KEEP_ALIVE: 30m
      # One summary at a time (the backend sends them one by one anyway) and one model loaded.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      # Downloaded models (a few GB), kept so they're only downloaded once; `down -v` erases them.
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - llm

  # Downloads the model the first time (about 6.6 GB for gemma4:e4b), then exits. Later runs see
  # it's already there and finish in a second. Summaries say "unavailable" until it's done.
  ollama-pull:
    image: ollama/ollama:0.40.11
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-gemma4:e4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - llm

  frontend:
    image: node:24-trixie-slim
    working_dir: /app
    # Installs packages (a quick no-op when nothing changed) and starts the Vite dev server.
    # --host makes it reachable from outside the container.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      # Where Vite forwards /api requests (see vite.config.ts).
      API_PROXY_TARGET: http://backend:7070
      # File-change events from Windows don't reach containers, so Vite has to poll for edits.
      VITE_USE_POLLING: "true"
    volumes:
      # Mounted live, so edits hot-reload in the browser.
      - ./frontend:/app
      # Kept in a Docker volume because some packages (rolldown, lightningcss) include OS-specific
      # binaries, so Windows and Linux can't share one node_modules. Don't remove this line.
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    # Not on the data network, so the frontend container can't reach the database at all.
    networks:
      - web

  # Optional database GUI in the browser: `docker compose --profile tools up -d pgadmin`, then open
  # http://localhost:5050 (see "Looking at the database" in the README). The "tools" profile means
  # it doesn't start with a plain `docker compose up`.
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    environment:
      # Its own login page, so other apps on this laptop can't open our database through it.
      # pgAdmin refuses to start without a password, so set PGADMIN_PASSWORD in .env first.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@sru.edu}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      # Don't run the mail server that's built into the image; we don't send email.
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      # Shows our database in the sidebar already set up. Only read the first time pgAdmin starts.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      # Keeps your pgAdmin login and settings between restarts; `down -v` erases it.
      - pgadmin-data:/var/lib/pgadmin
    ports:
      # 127.0.0.1 only, same as the database: reachable from this laptop, not the network.
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    networks:
      - data

  # Runs the backend unit tests: `docker compose run --rm backend-tests`
  # The "test" profile means it doesn't start with `docker compose up`.
  backend-tests:
    image: maven:3.9.15-eclipse-temurin-25
    profiles: ["test"]
    working_dir: /app
    command: mvn -B test
    environment:
      # Only used by the security-scan profile (see .env.example).
      NVD_API_KEY: ${NVD_API_KEY:-}
      # The repository tests run against a real Postgres: a separate brainfeed_test database on
      # the db service, recreated each run, so your real data is never touched (TestDatabase.java).
      TEST_DB_URL: jdbc:postgresql://db:5432/
      # Optional: a different test database name, so two test runs at once don't collide.
      TEST_DB_NAME: ${TEST_DB_NAME:-}
      TEST_DB_USER: ${DB_USER:-brainfeed}
      TEST_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env - copy .env.example to .env}
      # Fail instead of skipping them if the database can't be reached.
      REQUIRE_DB_TESTS: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Keeps downloaded libraries between runs so tests start fast after the first time.
      - maven-cache:/root/.m2
    networks:
      - data

# Keeps the layers apart: database <-> backend on "data", backend <-> frontend on "web", and
# backend <-> LLM on "llm". The frontend can reach neither the database nor the LLM.
networks:
  data:
  web:
  llm:

volumes:
  brainfeed-pgdata:
  frontend-node-modules:
  maven-cache:
  pgadmin-data:
  ollama-models:
