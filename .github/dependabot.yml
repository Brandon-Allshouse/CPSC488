# Dependabot checks for new library, image and GitHub Actions versions every week and opens PRs
# for them (NIST SSDF RV.1, OWASP Top 10 A06). See "Dependency updates" in the README.
#
# Each section groups its updates into a single PR. Related packages often only work when they're
# upgraded together (vite and @vitejs/plugin-react, react and react-dom), so separate PRs would
# each fail CI on their own.
#
# Java, Node and Postgres major versions are ignored below on purpose. Each one is set in several
# files that have to change together, and Dependabot would also suggest short-lived releases like
# Java 26 or Node 25. Upgrade them by hand, using the checklist in the README.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # These are the type definitions for Node itself, so they should match the Node version we
      # run, not the newest one. Bump it when you upgrade Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # The Java version is at the end of this tag (3.9.15-eclipse-temurin-25), and Dependabot
      # treats a change there as an ordinary update. That's how it once tried to move us to
      # Java 26. It's only used to compile, so we update it by hand along with Java.
      - dependency-name: "maven"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # A new Postgres major version also needs a new volume name. See the comment on the db
      # service in docker-compose.yml.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Same reason as in the docker section above.
      - dependency-name: "maven"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
