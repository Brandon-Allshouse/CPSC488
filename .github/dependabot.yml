# Weekly dependency update PRs (NIST SSDF RV.1, OWASP Top 10 A06). See "Dependency updates" in
# the README.
#
# Each ecosystem is grouped into one PR because related packages often have to be upgraded
# together, like vite and @vitejs/plugin-react.
#
# Java, Node and Postgres major versions are ignored because they're upgraded by hand. Each is set
# in several files that have to change at the same time.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Must match the Node major version in docker-compose.yml and ci.yml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # Dependabot treats the Java version at the end of this tag as a normal update, so it would
      # bump Java on its own. Update this image by hand when upgrading Java.
      - dependency-name: "maven"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ["*"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # A major upgrade also needs a new volume. See the db service in docker-compose.yml.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Updated by hand with Java, as in the docker section above.
      - dependency-name: "maven"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
