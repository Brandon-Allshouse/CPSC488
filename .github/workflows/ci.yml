# Builds, tests and scans every push and PR (NIST SSDF PW.7, PW.8, RV.1).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run tests
        run: mvn -B verify

  docker:
    # Makes sure the Docker setup everyone uses locally still builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build backend
      - name: Validate docker-compose.yml
        run: |
          printf 'DB_PASSWORD=ci\nPASSWORD_PEPPER=ci\n' > .env
          docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci
      - name: Check dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - name: Type-check and build
        run: npm run build

  codeql:
    # Static analysis for security bugs in Java and TypeScript.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
